# RusCraft: выкладка статики www/ за nginx (шаг S7; шаблон, не включать без проверки).
# Обязательное: COOP/COEP (иначе SharedArrayBuffer/OPFS недоступны), https
# (secure context), MIME для wasm, вечный кэш пути /<uuid>/** (иммутабельный релиз).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name ruscraft.example;          # ← домен
    root /srv/ruscraft/www;                # ← содержимое артефакта ruscraft-www
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ruscraft.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruscraft.example/privkey.pem;

    # Cross-origin isolation — без этого Luanti-wasm не запускается вовсе.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;

    types {
        application/wasm wasm;
    }

    # Иммутабельный релиз: /<12 hex>/... — кэш навсегда (схема апстрима).
    location ~ ^/[0-9a-f]{12}/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # WSS-прокси мультиплеера (lwproxy, шаг S6):
    location /mtproxy {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
