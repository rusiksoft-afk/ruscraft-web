name: ruscraft-build

# Полная сборка Luanti→WASM (~30–90 мин). Запуск: вручную (workflow_dispatch)
# или тегом v* (для будущих релизов). PUSH-сборка не нужна — дорого.
#
# Схема: docker-этап base (окружение), затем ./build_all.sh выполняется ВНУТРИ
# контейнера с примонтированной рабочей копией — упавшие логи configure и готовый
# www/ остаются в workspace раннера и попадают в артефакты.
on:
  workflow_dispatch:
    inputs:
      build_kind:
        description: "Профиль сборки"
        required: true
        default: release
        type: choice
        options: [release, profile, debug]

env:
  HARNESS_IMAGE: ruscraft-base

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Проверка пинов (без latest)
        run: |
          test -f versions.lock
          grep -q '^minetest_game=[0-9a-f]\{40\}' versions.lock
          grep -q '^luanti-wasm=[0-9a-f]\{40\}' versions.lock

      - name: Docker build (образ окружения сборки)
        run: |
          docker build --target base -t "$HARNESS_IMAGE" .
          docker images "$HARNESS_IMAGE"

      - name: Сборка Luanti→WASM в контейнере
        run: |
          docker run --rm -v "$PWD:/ci" -e BUILD_KIND="${{ inputs.build_kind }}" \
            "$HARNESS_IMAGE" bash -c 'cd /ci && ./build_all.sh'

      - name: Диагностика при падении (логи configure)
        if: failure()
        run: |
          for f in $(find build* -name config.log 2>/dev/null | head -6); do
            echo "===== $f"; grep -B2 -A8 -E "configure: (error|fatal)" "$f" | tail -60;
          done

      - name: Прикрепить config.log к артефактам
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-logs
          path: |
            build*/**/config.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Смоук-тест структуры www/
        run: |
          ls -la www/ || true
          test -f www/.htaccess
          UUID=$(ls www | grep -E '^[0-9a-f]{12}$' | head -1)
          echo "release uuid: $UUID"
          test -n "$UUID"
          test -f "www/$UUID/luanti.wasm"
          test -f "www/$UUID/luanti.js"
          test -f "www/$UUID/packs/base.pack"
          test -f "www/$UUID/packs/minetest_game.pack"   # RusCraft: игровой пак
          du -sh www/$UUID/luanti.wasm www/$UUID/packs/*
          grep -i "Cross-Origin-Embedder-Policy" www/.htaccess

      - uses: actions/upload-artifact@v4
        if: always()   # и при красном смоук-тесте: артефакт нужен для диагностики
        with:
          name: ruscraft-www
          path: |
            www/
            www/.htaccess
            www/*/.htaccess
            www/*/packs/.htaccess
          if-no-files-found: ignore
          retention-days: 30
